{% extends "base.html" %}
{% block title %}Editar producto de facturación · SASTRE ERP{% endblock %}
{% block content %}
<div class="ds-demo-breadcrumbs"><a href="{% url 'inicio' %}">Inicio</a><a href="{% url 'facturacion' %}">Facturación</a><span>Editar producto</span></div>
<header><h1 class="ds-demo-title">Editar producto de facturación</h1><p class="ds-demo-lead">Actualiza nombre, precio, categoría e impuestos del producto.</p></header>
<section class="card"><div class="card-body"><form method="post">{% csrf_token %}
  <div class="form-grid">
    <div><label for="id_categoria">Categoría</label><select id="id_categoria" name="categoria" required><option value="PAN" {% if producto.categoria == "PAN" %}selected{% endif %}>PAN</option><option value="PAN_CON_VEGETALES" {% if producto.categoria == "PAN_CON_VEGETALES" %}selected{% endif %}>PAN CON VEGETALES</option><option value="GALLETA" {% if producto.categoria == "GALLETA" %}selected{% endif %}>GALLETA</option><option value="BIZCOCHO" {% if producto.categoria == "BIZCOCHO" %}selected{% endif %}>BIZCOCHO</option></select></div>
    <div><label for="id_nombre_factura">Nombre en factura</label><input id="id_nombre_factura" type="text" name="nombre_factura" value="{{ producto.nombre_factura }}" required></div>
    <div><label for="id_precio">Precio sin ITBIS</label><input id="id_precio" type="text" name="precio_sin_itbis" value="{{ producto.precio_sin_itbis }}" required></div>
    <div><label for="id_itbis">Porcentaje ITBIS</label><input id="id_itbis" type="text" name="porcentaje_itbis" value="{{ producto.porcentaje_itbis }}"></div>
    <label><input type="checkbox" name="aplica_itbis" {% if producto.aplica_itbis %}checked{% endif %}> Aplica ITBIS</label>
    <label><input type="checkbox" name="activo" {% if producto.activo %}checked{% endif %}> Activo</label>
  </div>
  <div class="ds-demo-form-actions"><a href="{% url 'facturacion' %}" class="btn btn-secondary">Cancelar</a><button type="submit" class="btn btn-primary">Guardar cambios</button></div>
</form></div></section>
{% endblock %}
