{% extends "base.html" %}
{% block title %}Editar menú diario · SASTRE ERP{% endblock %}
{% block content %}
<div class="ds-demo-breadcrumbs"><a href="{% url 'inicio' %}">Inicio</a><span>Operaciones</span><span>Menú diario</span></div>
<header><h1 class="ds-demo-title">Editar menú diario</h1><p class="ds-demo-lead">Actualiza la fecha y el producto planificado.</p></header>
<section class="card"><div class="card-body">
  <form method="post">{% csrf_token %}
    <div class="form-grid">
      <div><label for="id_fecha">Fecha</label><input id="id_fecha" type="date" name="fecha" value="{{ menu.fecha|date:'Y-m-d' }}" required></div>
      <div><label for="id_producto">Producto</label><input id="id_producto" type="text" name="producto" value="{{ menu.producto }}" required></div>
    </div>
    <div class="ds-demo-form-actions"><a href="{% url 'carga_menu' %}" class="btn btn-secondary">Cancelar</a><button type="submit" class="btn btn-primary">Guardar cambios</button></div>
  </form>
</div></section>
{% endblock %}
