<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Acceso seguro | SASTRE ERP{% endblock %}</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1f2937;
            background:
                radial-gradient(circle at 20% 20%, rgba(16,185,129,.12), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(59,130,246,.12), transparent 40%),
                linear-gradient(135deg, #f8fafc, #fff);
        }
        .auth-shell { width: 100%; max-width: 540px; }
        .auth-brand { display: flex; align-items: center; gap: 13px; margin: 0 0 22px 12px; }
        .auth-brand-mark {
            width: 54px; height: 54px; display: grid; place-items: center;
            border-radius: 17px; color: #fff; font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #10b981);
        }
        .auth-brand strong, .auth-brand span { display: block; }
        .auth-brand span { color: #64748b; font-size: 13px; }
        .container { width: 100%; }
        .row { display: flex; justify-content: center; }
        .col-lg-5 { width: 100%; }
        .card {
            overflow: hidden; border: 0; border-radius: 28px; background: #fff;
            box-shadow: 0 30px 90px rgba(15, 23, 42, .14);
        }
        .card-body { padding: 42px; }
        .text-center { text-align: center; }
        h2 { margin: 0 0 12px; font-size: 30px; }
        .text-muted { color: #64748b; line-height: 1.6; }
        .fw-semibold { font-weight: 700; }
        .text-dark { color: #1d4ed8; overflow-wrap: anywhere; }
        .mt-2 { margin-top: 8px; } .mb-0 { margin-bottom: 0; }
        .mb-3 { margin-bottom: 14px; } .mb-4 { margin-bottom: 22px; }
        .alert { margin-bottom: 14px; padding: 12px 14px; border-radius: 12px; background: #eff6ff; color: #1e3a8a; }
        .form-label { display: block; margin-bottom: 8px; }
        .form-control {
            width: 100%; padding: 15px 16px; border: 1px solid #d1d5db;
            border-radius: 14px; font-size: 18px; letter-spacing: .12em;
        }
        .d-grid { display: grid; }
        .btn { border: 0; cursor: pointer; font-size: 15px; font-weight: 700; }
        .btn-primary {
            padding: 15px 18px; border-radius: 15px; color: #fff;
            background: linear-gradient(135deg, #3b82f6, #10b981);
        }
        .btn-link { padding: 6px; color: #2563eb; background: transparent; }
        @media (max-width: 560px) { .card-body { padding: 32px 24px; } }
    </style>
</head>
<body>
<div class="auth-shell">
    <div class="auth-brand">
        <div class="auth-brand-mark" aria-hidden="true">SE</div>
        <div><strong>SASTRE ERP</strong><span>Verificación segura de cuenta</span></div>
    </div>
    {% block auth_content %}{% endblock %}
</div>
</body>
</html>
