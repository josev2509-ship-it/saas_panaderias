{% extends "base.html" %}{% block content %}<style>.crm{max-width:1600px;margin:auto;padding:1rem}.crm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}.crm-card{background:var(--ds-color-surface,#fff);border:1px solid #d9dee7;border-radius:12px;padding:1rem;overflow-wrap:anywhere}.crm-nav,.crm-actions{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}.crm-table-wrap{overflow-x:auto}.crm-table{width:100%;border-collapse:collapse}.crm-table th,.crm-table td{padding:.65rem;border-bottom:1px solid #ddd;text-align:left}.crm-kanban{display:grid;grid-template-columns:repeat(7,minmax(230px,1fr));gap:1rem;overflow-x:auto;padding-bottom:1rem}.crm-column{background:#f4f6f9;border-radius:12px;padding:.7rem}.crm-alert{border-left:5px solid #c62828}@media(max-width:600px){.crm{padding:.6rem}.crm-grid{grid-template-columns:1fr}.crm-table thead{display:none}.crm-table tr{display:block;border:1px solid #ddd;margin-bottom:.7rem;border-radius:8px}.crm-table td{display:block}}@media print{.crm-nav,.crm-actions,button{display:none!important}}</style><main class="crm"><nav class="crm-nav"><a href="{% url 'comercial:crm_dashboard' %}">CRM</a><a href="{% url 'comercial:prospectos_lista' %}">Prospectos</a><a href="{% url 'comercial:oportunidades_lista' %}">Oportunidades</a><a href="{% url 'comercial:pipeline' %}">Pipeline</a><a href="{% url 'comercial:actividades_lista' %}">Actividades</a><a href="{% url 'comercial:agenda' %}">Agenda</a><a href="{% url 'comercial:crm_reportes' %}">Reportes</a></nav>{% block crm_content %}{% endblock %}</main>{% endblock %}
