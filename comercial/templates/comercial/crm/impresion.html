<!doctype html><html lang="es"><head><meta charset="utf-8"><title>{{ titulo }}</title><style>body{font-family:sans-serif}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bbb;padding:6px}@media print{button{display:none}}</style></head><body><button onclick="window.print()">Imprimir</button><h1>{{ titulo }} — {{ empresa }}</h1><table><tr>{% for h in headers %}<th>{{ h }}</th>{% endfor %}</tr>{% for row in rows %}<tr>{% for v in row %}<td>{{ v }}</td>{% endfor %}</tr>{% endfor %}</table></body></html>
