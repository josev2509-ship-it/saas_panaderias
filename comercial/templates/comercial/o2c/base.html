{% extends "base.html" %}{% block content %}<style>.o2c{max-width:1500px;margin:auto;padding:1rem}.o2c-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem}.o2c-card{background:#fff;border:1px solid #dce1e8;border-radius:12px;padding:1rem;overflow-wrap:anywhere}.o2c-nav,.o2c-actions{display:flex;gap:.7rem;flex-wrap:wrap}.o2c-scroll{overflow-x:auto}.o2c table{width:100%;border-collapse:collapse}.o2c td,.o2c th{padding:.65rem;border-bottom:1px solid #ddd;text-align:left}.tabs{display:flex;gap:.5rem;overflow-x:auto}@media(max-width:390px){.o2c{padding:.6rem}.o2c-grid{grid-template-columns:1fr}}@media print{.o2c-nav,.o2c-actions,button{display:none}}</style><main class="o2c"><nav class="o2c-nav"><a href="{% url 'comercial:o2c_dashboard' %}">Resumen</a><a href="{% url 'comercial:clientes_lista' %}">Clientes</a><a href="{% url 'comercial:productos_comerciales' %}">Productos</a><a href="{% url 'comercial:listas_precio' %}">Precios</a><a href="{% url 'comercial:simulador_precio' %}">Simulador</a><a href="{% url 'comercial:cotizaciones_lista' %}">Cotizaciones</a><a href="{% url 'comercial:pedidos_lista' %}">Pedidos</a><a href="{% url 'comercial:programacion_comercial' %}">Programación</a><a href="{% url 'comercial:o2c_reportes' %}">Reportes</a></nav>{% block o2c_content %}{% endblock %}</main>{% endblock %}
