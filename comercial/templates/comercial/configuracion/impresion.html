<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Configuración comercial</title><style>body{font-family:sans-serif}table{width:100%;border-collapse:collapse}td,th{border:1px solid #bbb;padding:6px}@media print{button{display:none}}</style></head><body><button onclick="window.print()">Imprimir</button><h1>Configuración comercial - {{ empresa }}</h1><table><tr><th>Tipo</th><th>Código</th><th>Nombre</th><th>Estado</th></tr>{% for fila in filas %}<tr>{% for valor in fila %}<td>{{ valor }}</td>{% endfor %}</tr>{% endfor %}</table></body></html>
