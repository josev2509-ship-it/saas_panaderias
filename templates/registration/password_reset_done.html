{% extends "base.html" %}

{% block content %}

<div class="app-page">

    <section class="card password-card">

        <div class="password-icon">
            ✉️
        </div>

        <h1 class="password-title">
            Revisa tu correo
        </h1>

        <p class="password-subtitle">
            Si el correo existe en el sistema, recibirás las instrucciones para restablecer tu contraseña.
        </p>

        <div class="form-actions">
            <a href="{% url 'login_usuario' %}" class="btn-primary">
                Volver al login
            </a>
        </div>

    </section>

</div>

<style>

.app-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;

    background:
        radial-gradient(circle at top left, rgba(99,102,241,0.15), transparent 25%),
        radial-gradient(circle at bottom right, rgba(16,185,129,0.15), transparent 25%),
        linear-gradient(135deg,#f8fafc,#eef2ff);
}

.password-card{
    width:100%;
    max-width:560px;
    padding:50px 45px;
    border-radius:28px;
    background:#ffffff;

    box-shadow:
        0 20px 60px rgba(15,23,42,0.08),
        0 8px 24px rgba(99,102,241,0.08);

    text-align:center;
    border:1px solid rgba(226,232,240,0.8);

    animation:fadeIn .5s ease;
}

.password-icon{
    width:90px;
    height:90px;

    margin:0 auto 25px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;

    background:linear-gradient(135deg,#6366f1,#2563eb);
    color:white;

    box-shadow:0 12px 30px rgba(37,99,235,.25);
}

.password-title{
    font-size:38px;
    font-weight:800;
    color:#0f172a;
    margin-bottom:18px;
}

.password-subtitle{
    font-size:17px;
    line-height:1.7;
    color:#475569;
    margin-bottom:35px;
}

.form-actions{
    display:flex;
    justify-content:center;
}

.btn-primary{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:14px 28px;

    border-radius:14px;

    background:linear-gradient(135deg,#2563eb,#6366f1);

    color:white;
    text-decoration:none;

    font-weight:700;
    font-size:15px;

    transition:.25s ease;

    box-shadow:0 10px 20px rgba(37,99,235,.20);
}

.btn-primary:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 30px rgba(37,99,235,.28);
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

{% endblock %}
