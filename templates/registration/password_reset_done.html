{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Revisa tu correo | SaaS Panaderías</title>
    <link rel="stylesheet" href="{% static 'conduces/css/app.css' %}">
</head>

<body style="margin:0; font-family:Segoe UI, Arial, sans-serif; background:#eef6fb;">

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px;">

    <section style="
        width:100%;
        max-width:520px;
        background:white;
        border-radius:28px;
        padding:45px 40px;
        text-align:center;
        box-shadow:0 20px 55px rgba(15,23,42,0.12);
    ">

        <div style="
            width:78px;
            height:78px;
            border-radius:22px;
            background:linear-gradient(135deg,#2563eb,#06b6d4);
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 24px;
            font-size:36px;
        ">
            ✉️
        </div>

        <h1 style="margin:0 0 14px; color:#0f172a; font-size:34px; font-weight:800;">
            Revisa tu correo
        </h1>

        <p style="margin:0 0 30px; color:#475569; font-size:16px; line-height:1.6;">
            Si el correo existe en el sistema, recibirás las instrucciones para restablecer tu contraseña.
        </p>

        <a href="{% url 'login_usuario' %}" style="
            display:inline-block;
            background:#2563eb;
            color:white;
            padding:14px 28px;
            border-radius:14px;
            text-decoration:none;
            font-weight:700;
        ">
            Volver al login
        </a>

    </section>

</div>

</body>
</html>
