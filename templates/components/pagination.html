{% if page.has_other_pages %}<nav class="ds-pagination" aria-label="Paginación"><a href="?page=1{{ query_suffix }}" aria-label="Primera página">Primera</a>{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}{{ query_suffix }}">Anterior</a>{% endif %}<span aria-current="page">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}{{ query_suffix }}">Siguiente</a>{% endif %}<a href="?page={{ page.paginator.num_pages }}{{ query_suffix }}" aria-label="Última página">Última</a></nav>{% endif %}
