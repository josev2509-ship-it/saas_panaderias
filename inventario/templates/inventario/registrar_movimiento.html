{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="app-page">

    <div class="topbar">
        <div>
            <h1>Registrar movimiento manual</h1>
            <p>Entradas, salidas, ajustes, mermas o consumos no automáticos.</p>
        </div>

        <div class="form-actions">
            <a href="{% url 'inventario:movimientos' %}" class="btn btn-light">Volver</a>
        </div>
    </div>

    <section class="card">
        <form method="post">
            {% csrf_token %}

            <div class="form-grid">
                <div>
                    <label>Producto</label>
                    <select name="producto_id" required>
                        <option value="">Seleccione...</option>
                        {% for producto in productos %}
                            <option value="{{ producto.id }}">{{ producto.nombre }} — Stock: {{ producto.stock_actual }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label>Tipo movimiento</label>
                    <select name="tipo" required>
                        <option value="entrada">Entrada</option>
                        <option value="salida">Salida</option>
                        <option value="ajuste">Ajuste entrada</option>
                        <option value="merma">Merma</option>
                        <option value="produccion">Producción</option>
                    </select>
                </div>

                <div>
                    <label>Cantidad</label>
                    <input type="number" step="0.0001" name="cantidad" required>
                </div>

                <div>
                    <label>Costo unitario</label>
                    <input type="number" step="0.0001" name="costo_unitario" value="0">
                </div>

                <div>
                    <label>Referencia</label>
                    <input type="text" name="referencia" placeholder="Factura, ajuste, nota interna...">
                </div>
            </div>

            <br>

            <div>
                <label>Observación</label>
                <textarea name="observacion" rows="3"></textarea>
            </div>

            <br>

            <button type="submit" class="btn">Guardar movimiento</button>
        </form>
    </section>

</div>

{% endblock %}
