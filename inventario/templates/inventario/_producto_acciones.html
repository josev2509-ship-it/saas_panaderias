<div class="row-actions"><a href="{% url 'inventario:editar_producto_inventario' producto.id %}" class="btn btn-small">Editar</a><a href="{% url 'inventario:kardex_producto' producto.id %}" class="btn btn-secondary btn-small">Kardex</a>{% if producto.activo %}<a href="{% url 'inventario:desactivar_producto_inventario' producto.id %}" class="btn btn-danger btn-small" onclick="return confirm('¿Seguro que deseas desactivar este producto?');">Desactivar</a>{% endif %}</div>
