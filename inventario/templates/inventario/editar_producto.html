{% extends "base.html" %}
{% block title %}Editar producto{% endblock %}
{% block content %}
<div class="app-page">
  <div class="topbar"><div><h1>Editar producto</h1><p>{{ producto.nombre }}</p></div><div class="form-actions"><a href="{% url 'inventario:kardex_producto' producto.id %}" class="btn btn-secondary">Kardex</a><a href="{% url 'inventario:productos' %}" class="btn btn-light">Volver</a></div></div>
  <section class="card"><form method="post">{% csrf_token %}
    <div class="form-grid">
      <div><label>Código</label><input type="text" name="codigo" value="{{ producto.codigo|default:'' }}"></div>
      <div><label>Nombre *</label><input type="text" name="nombre" value="{{ producto.nombre }}" required></div>
      <div><label>Tipo</label><select name="tipo">{% for valor, etiqueta in tipos %}<option value="{{ valor }}" {% if producto.tipo == valor %}selected{% endif %}>{{ etiqueta }}</option>{% endfor %}</select></div>
      <div><label>Clasificación operativa</label><select name="clasificacion_operativa">{% for valor, etiqueta in clasificaciones %}<option value="{{ valor }}" {% if producto.clasificacion_operativa == valor %}selected{% endif %}>{{ etiqueta }}</option>{% endfor %}</select></div>
      <div><label>Unidad base</label><select name="unidad_medida">{% for valor, etiqueta in unidades %}<option value="{{ valor }}" {% if producto.unidad_medida == valor %}selected{% endif %}>{{ etiqueta }}</option>{% endfor %}</select></div>
      <div><label>Unidad compra</label><input type="text" name="unidad_compra" value="{{ producto.unidad_compra|default:'' }}"></div>
      <div><label>Cantidad por empaque</label><input type="number" min="0.0001" step="0.0001" name="cantidad_por_empaque" value="{{ producto.cantidad_por_empaque }}"></div>
      <div><label>Existencia actual</label><input type="text" value="{{ producto.existencia_formateada }}" disabled><small>La existencia se modifica mediante movimientos para conservar trazabilidad.</small></div>
      <div><label>Stock mínimo</label><input type="number" min="0" step="0.0001" name="stock_minimo" value="{{ producto.stock_minimo }}"></div>
      <div><label>Precio por empaque</label><input type="number" min="0" step="0.0001" name="precio_unitario_compra" value="{{ producto.precio_unitario_compra }}"></div>
      <div><label>ITBIS %</label><input type="number" min="0" step="0.01" name="porcentaje_itbis" value="{{ producto.porcentaje_itbis }}"></div>
      <div><label>Proveedor</label><input type="text" name="proveedor" value="{{ producto.proveedor|default:'' }}"></div>
    </div><br>
    <label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" name="afecta_produccion" {% if producto.afecta_produccion %}checked{% endif %}>Afecta proyección de producción</label>
    <label style="display:flex;gap:8px;align-items:center;margin-top:10px;"><input type="checkbox" name="activo" {% if producto.activo %}checked{% endif %}>Producto activo</label>
    <div class="form-actions" style="margin-top:18px;"><button type="submit" class="btn btn-primary">Guardar cambios</button><a href="{% url 'inventario:productos' %}" class="btn btn-secondary">Cancelar</a></div>
  </form></section>
</div>
{% endblock %}
